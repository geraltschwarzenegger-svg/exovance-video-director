name: Проверка видеоинструментов

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Установить FFmpeg и Tesseract
        run: |
          sources="$RUNNER_TEMP/exovance-ubuntu.list"
          cat > "$sources" <<'EOF'
          deb https://archive.ubuntu.com/ubuntu noble main universe
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - name: Установить библиотеки Python
        run: python -m pip install -r requirements.txt
      - name: Проверить OCR, видео и звук
        run: python tests/smoke_test.py
